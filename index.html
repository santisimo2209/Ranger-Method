
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANGER METHOD | Roberto Garcia</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #030b16;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* FONDO ANIMADO */

        body::before {
            content: "";
            position: fixed;
            width: 600px;
            height: 600px;
            background: #0759a8;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.18;
            top: -250px;
            left: 50%;
            transform: translateX(-50%);
            animation: glow 5s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes glow {
            from {
                transform: translateX(-50%) scale(1);
                opacity: 0.12;
            }

            to {
                transform: translateX(-50%) scale(1.25);
                opacity: 0.22;
            }
        }

        /* NAVEGACIÓN */

        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            padding: 25px 7%;

            display: flex;
            justify-content: center;

            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .mini-logo {
            font-size: 16px;
            letter-spacing: 4px;
            font-weight: bold;
        }

        .mini-logo span {
            color: #168cff;
        }

        /* HERO */

        .hero {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 100px 20px 60px;
        }

        /* LOGO PRINCIPAL */

        .main-logo {
            animation: appear 1.2s ease forwards;
        }

        .ranger {
            font-size: clamp(65px, 11vw, 150px);
            font-weight: 900;
            letter-spacing: 10px;
            line-height: 0.9;

            color: white;

            text-shadow:
                0 0 20px rgba(255,255,255,0.08);

            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        .method {
            font-size: clamp(35px, 6vw, 80px);
            font-weight: 300;
            letter-spacing: 15px;

            color: white;

            margin-top: 15px;
        }

        .by {
            margin-top: 20px;

            font-size: 14px;
            letter-spacing: 5px;

            color: #168cff;

            text-transform: uppercase;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 0 15px rgba(22,140,255,0.05);
            }

            to {
                text-shadow: 0 0 35px rgba(22,140,255,0.35);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* FRASE */

        .slogan {
            margin-top: 45px;

            font-size: clamp(18px, 2.5vw, 26px);

            color: #a9bacb;

            max-width: 700px;

            line-height: 1.5;

            animation: appear 1.5s ease forwards;
        }

        .slogan strong {
            color: white;
        }

        /* BOTONES */

        .buttons {
            margin-top: 45px;

            display: flex;
            flex-wrap: wrap;

            justify-content: center;

            gap: 14px;

            animation: appear 1.8s ease forwards;
        }

        .button {
            text-decoration: none;

            color: white;

            border: 1px solid #214667;

            background: #081727;

            padding: 15px 25px;

            min-width: 145px;

            border-radius: 5px;

            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;

            transition: 0.3s;
        }

        .button:hover {
            background: #168cff;

            border-color: #168cff;

            transform: translateY(-5px);

            box-shadow: 0 10px 30px rgba(22,140,255,0.2);
        }

        .button.main {
            background: #168cff;
            border-color: #168cff;
        }

        .button.main:hover {
            background: #0875c9;
        }

        /* INDICADOR */

        .scroll {
            position: absolute;
            bottom: 25px;

            font-size: 11px;
            letter-spacing: 3px;

            color: #506579;

            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(8px);
            }
        }

        /* MÓVIL */

        @media (max-width: 600px) {

            .ranger {
                letter-spacing: 5px;
            }

            .method {
                letter-spacing: 7px;
            }

            .by {
                letter-spacing: 3px;
            }

            .buttons {
                width: 100%;
            }

            .button {
                width: 80%;
            }
        }

    </style>
</head>

<body>

    <nav>
        <div class="mini-logo">
            RANGER <span>METHOD</span>
        </div>
    </nav>


    <main class="hero">

        <!-- LOGO -->

        <div class="main-logo">

            <div class="ranger">
                RANGER
            </div>

            <div class="method">
                METHOD
            </div>

            <div class="by">
                by Roberto Garcia
            </div>

        </div>


        <!-- FRASE -->

        <p class="slogan">
            <strong>No esperes a estar listo.</strong><br>
            Entrena. Evoluciona. Conviértete en tu mejor versión.
        </p>


        <!-- BOTONES -->

        <div class="buttons">

            <a href="pagina2.html" class="button main">
                MÉTODO
            </a>

            <a href="pagina3.html" class="button">
                ENTRENAMIENTO
            </a>

            <a href="pagina4.html" class="button">
                INFORMACIÓN
            </a>

            <a href="pagina5.html" class="button">
                CONTACTO
            </a>

        </div>

    </main>


    <div class="scroll">
        RANGER METHOD
    </div>

</body>
</html>
